name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check backend eval
      - name: Tests
        working-directory: backend
        run: python -m pytest -q
      - name: Seed smoke
        run: python eval/seed.py
      - name: Eval smoke
        run: python eval/run_eval.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t resume-screener:ci .
      - name: Run container and hit the health endpoint
        run: |
          docker run -d --name app -p 8077:8077 resume-screener:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8077/v1/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1

  frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - name: Install dependencies
        working-directory: frontend-app
        run: npm ci
      - name: Type check
        working-directory: frontend-app
        run: npx tsc --noEmit
      - name: Component tests
        working-directory: frontend-app
        run: npm run test
      - name: Build
        working-directory: frontend-app
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright browser
        working-directory: frontend-app
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend-app
        run: npm run e2e
